[package]
name = "hq-core"
description = "Vault HQ's core: vaults, notes, tasks, search, bookmarks. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
sha2 = "0.10"
libc = "0.2"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# F bookmarks
plist = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
# native-tls: macOS Security.framework and the system roots, no bundled CA list
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
url = "2"

[dev-dependencies]
tempfile = "3"
